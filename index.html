<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swasth seva – Healthcare Connect (Demo)</title>
<meta name="description" content="Dhanno connects patients with doctors, pharmacies, hospitals and ambulances. Hackathon demo with sample data.">
<style>
/* ============================== CSS ============================== */
:root{
  --navy:#f8faf8; --navy2:#0B2550; --navy3:#12326B; --card:#0D2554;
  --yellow:#ff3b3b; --yellow2:#FFE680; --text:#EAF0FB; --muted:#9FB1D1;
  --ok:#3DDC97; --bad:#FF6B6B; --line:rgba(255,255,255,.1);
  --radius:18px; --shadow:0 10px 40px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans Devanagari',sans-serif;background:var(--navy);color:var(--text);line-height:1.55;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(600px 400px at 85% -5%,rgba(255,212,59,.14),transparent 60%),
  radial-gradient(700px 500px at -10% 30%,rgba(60,120,255,.18),transparent 60%),var(--navy)}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;color:inherit}
input,select{font:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

/* Demo banner */
.demo-banner{background:var(--yellow);color:var(--navy);text-align:center;font-weight:700;font-size:.85rem;padding:6px 12px}

/* Header */
header{position:sticky;top:0;z-index:50;background:rgba(7,27,58,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{max-width:1200px;margin:auto;display:flex;align-items:center;gap:14px;padding:12px 18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.3rem;letter-spacing:.3px}
.logo i{width:36px;height:36px;border-radius:11px;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-style:normal;font-size:1.2rem;animation:pulse 2.4s infinite}
.logo span{color:var(--yellow)}
nav.links{display:flex;gap:4px;margin-left:auto}
nav.links button{background:none;padding:8px 13px;border-radius:999px;color:var(--muted);font-weight:600;transition:.25s}
nav.links button:hover{color:var(--text);background:rgba(255,255,255,.07)}
nav.links button.active{background:var(--yellow);color:var(--navy)}
.lang{display:flex;background:var(--navy2);border-radius:999px;padding:3px;border:1px solid var(--line)}
.lang button{background:none;padding:5px 12px;border-radius:999px;font-weight:700;font-size:.85rem;color:var(--muted);transition:.25s}
.lang button.on{background:var(--yellow);color:var(--navy)}
.burger{display:none;background:var(--navy2);width:42px;height:42px;border-radius:12px;font-size:1.3rem}

/* Layout */
main{max-width:1200px;margin:auto;padding:22px 18px 110px}
.view{display:none;animation:fadeUp .5s ease}
.view.show{display:block}
h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.1;font-weight:800}
h2{font-size:clamp(1.4rem,3vw,2rem);margin-bottom:6px}
h3{font-size:1.1rem}
.muted{color:var(--muted)}
.hl{color:var(--yellow)}
.section-head{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between;margin:10px 0 16px}

/* Hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:30px 0 10px}
.hero p{margin:16px 0 24px;color:var(--muted);font-size:1.1rem;max-width:520px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{background:var(--yellow);color:var(--navy);font-weight:800;padding:12px 22px;border-radius:999px;transition:.25s;box-shadow:0 6px 20px rgba(255,212,59,.25)}
.btn:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(255,212,59,.35)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--yellow);color:var(--yellow)}
.btn.sm{padding:8px 15px;font-size:.88rem}
.btn.red{background:var(--bad);color:#fff;box-shadow:none}
.btn[disabled]{opacity:.4;pointer-events:none}
.hero-art{position:relative;aspect-ratio:1;max-width:430px;margin:auto;width:100%}
.hero-art .ring{position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(255,212,59,.35);animation:spin 30s linear infinite}
.hero-art .ring.r2{inset:12%;animation-direction:reverse;animation-duration:20s;border-color:rgba(255,255,255,.18)}
.hero-art .core{position:absolute;inset:26%;border-radius:50%;background:radial-gradient(circle,var(--yellow),#e6b800);display:grid;place-items:center;font-size:4.5rem;color:var(--navy);animation:pulse 2.6s infinite;font-weight:900}
.chip-float{position:absolute;background:var(--card);border:1px solid var(--line);padding:8px 13px;border-radius:14px;font-weight:700;font-size:.85rem;box-shadow:var(--shadow);animation:float 5s ease-in-out infinite}
.chip-float:nth-of-type(3){top:4%;left:6%}
.chip-float:nth-of-type(4){top:18%;right:-2%;animation-delay:-1.5s}
.chip-float:nth-of-type(5){bottom:12%;left:-2%;animation-delay:-3s}
.chip-float:nth-of-type(6){bottom:2%;right:8%;animation-delay:-4s}

/* Context bar (template variables) */
.ctx{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 6px}
.ctx span{background:var(--navy2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:.82rem;color:var(--muted)}
.ctx b{color:var(--yellow)}

/* Cards / grids */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:linear-gradient(160deg,var(--card),var(--navy2));border:1px solid var(--line);border-radius:var(--radius);padding:18px;transition:.3s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-6px);border-color:rgba(255,212,59,.5);box-shadow:var(--shadow)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,212,59,.07),transparent 70%);transform:translateX(-100%);transition:.7s}
.card:hover::after{transform:translateX(100%)}
.avatar{width:54px;height:54px;border-radius:16px;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:1.2rem;flex:none}
.row{display:flex;gap:12px;align-items:center}
.between{justify-content:space-between}
.mt{margin-top:12px}
.tag{display:inline-block;font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,212,59,.14);color:var(--yellow);margin:3px 4px 0 0}
.tag.on{background:rgba(61,220,151,.15);color:var(--ok)}
.tag.off{background:rgba(255,107,107,.15);color:var(--bad)}
.tag.blue{background:rgba(90,150,255,.18);color:#9cc2ff}
.dist{font-weight:800;color:var(--yellow)}
.demo-tag{position:absolute;top:10px;right:10px;font-size:.62rem;background:rgba(255,255,255,.1);padding:2px 7px;border-radius:6px;color:var(--muted);letter-spacing:.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--navy2);border:1.5px solid var(--line);border-radius:999px;padding:4px 16px;transition:.25s}
.search:focus-within{border-color:var(--yellow);box-shadow:0 0 0 4px rgba(255,212,59,.12)}
.search input{flex:1;background:none;border:0;color:var(--text);padding:9px 0;outline:0}
select{background:var(--navy2);color:var(--text);border:1.5px solid var(--line);border-radius:999px;padding:10px 16px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pill{background:var(--navy2);border:1px solid var(--line);padding:7px 14px;border-radius:999px;font-weight:600;font-size:.88rem;transition:.25s}
.pill:hover{border-color:var(--yellow)}
.pill.on{background:var(--yellow);color:var(--navy);border-color:var(--yellow)}

/* Dashboard */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:26px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:left;transition:.3s}
.stat:hover{transform:translateY(-4px);border-color:var(--yellow)}
.stat b{font-size:2.2rem;color:var(--yellow);display:block;line-height:1.1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bars{display:flex;align-items:end;gap:10px;height:170px;margin-top:14px}
.bars div{flex:1;background:linear-gradient(180deg,var(--yellow),#c79a00);border-radius:8px 8px 0 0;height:0;transition:height 1.2s cubic-bezier(.2,.8,.2,1);position:relative}
.bars div span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:.7rem;color:var(--muted);white-space:nowrap}
.bars div em{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:.72rem;font-style:normal;font-weight:700}
.dash-note{font-size:.78rem;color:var(--muted);margin-top:30px}

/* Map */
.map{background:radial-gradient(circle,#0e2d63,#061630);border:1px solid var(--line);border-radius:var(--radius);width:100%;max-height:340px}
.map .dot{cursor:pointer;transition:.2s;transform-box:fill-box;transform-origin:center}
.map .dot:hover{transform:scale(1.6)}
.sweep{transform-origin:200px 170px;animation:spin 5s linear infinite}

/* Emergency */
.sos{background:linear-gradient(135deg,#ff4d4d,#b30000);border:0}
.sos h2{color:#fff}
.sos-btn{width:130px;height:130px;border-radius:50%;background:#fff;color:#c00000;font-weight:900;font-size:1.6rem;animation:sos 1.6s infinite;flex:none}
.sos-btn:hover{transform:scale(1.07)}
.timeline{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.timeline div{display:flex;gap:10px;align-items:center;opacity:.35;transition:.5s}
.timeline div.done{opacity:1}
.timeline div i{width:22px;height:22px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:var(--navy);font-style:normal;font-size:.8rem;font-weight:800}

/* Aftercare */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--navy2);border:1px solid var(--line);margin-bottom:10px;cursor:pointer;transition:.25s}
.check:hover{border-color:var(--yellow);transform:translateX(4px)}
.check input{accent-color:var(--yellow);width:20px;height:20px;margin-top:3px}
.check.done span{text-decoration:line-through;color:var(--muted)}
.progress{height:10px;background:var(--navy2);border-radius:99px;overflow:hidden;margin:10px 0 20px}
.progress div{height:100%;background:linear-gradient(90deg,var(--yellow),var(--ok));width:0;transition:width .6s}

/* Modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(2,10,25,.75);backdrop-filter:blur(6px);display:none;place-items:center;z-index:100;padding:16px}
.modal-bg.open{display:grid;animation:fade .25s}
.modal{background:var(--navy2);border:1px solid var(--line);border-radius:22px;padding:24px;width:min(480px,100%);max-height:90vh;overflow:auto;animation:pop .35s}
.modal label{display:block;margin:12px 0 5px;font-weight:600;font-size:.9rem}
.modal input,.modal select{width:100%;background:var(--navy);border-radius:12px}
.modal input{border:1.5px solid var(--line);color:var(--text);padding:10px 14px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,40px);background:var(--yellow);color:var(--navy);padding:12px 22px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.4s;z-index:200;max-width:92vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Pitch slides */
.slides{scroll-snap-type:y proximity}
.slide{min-height:78vh;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:30px;margin-bottom:22px;border-radius:28px;background:linear-gradient(150deg,var(--navy2),var(--navy));border:1px solid var(--line);position:relative;overflow:hidden}
.slide::before{content:attr(data-n);position:absolute;right:24px;top:6px;font-size:9rem;font-weight:900;color:rgba(255,212,59,.07)}
.slide ul{list-style:none;display:grid;gap:10px;max-width:760px}
.slide li{background:rgba(255,255,255,.05);padding:12px 16px;border-radius:12px;border-left:4px solid var(--yellow)}

/* Mobile bottom nav */
.bottom{display:none}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:30px 16px}

/* Keyframes */
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-12px)}}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(255,212,59,0)}0%{box-shadow:0 0 0 0 rgba(255,212,59,.5)}}
@keyframes sos{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}100%{box-shadow:0 0 0 30px rgba(255,255,255,0)}}
.reveal{opacity:0;transform:translateY(24px);transition:.7s}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}

/* Responsive */
@media(max-width:860px){
  .hero,.two{grid-template-columns:1fr}
  nav.links{display:none}
  .lang{margin-left:auto}
  .burger{display:none}
  .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(7,27,58,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:60;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom button{background:none;display:flex;flex-direction:column;align-items:center;font-size:.66rem;color:var(--muted);padding:4px 6px;gap:2px;border-radius:10px;font-weight:600}
  .bottom button b{font-size:1.25rem}
  .bottom button.active{color:var(--yellow)}
  .toast{bottom:84px}
}
</style>
</head>

/* ---------- 3. Backend layer (async API over localStorage) ---------- */
const API = (() => {
  const KEY = "dhanno_demo_v1";
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const write = d => { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch {} };
  const delay = (v) => new Promise(r => setTimeout(() => r(v), 250)); // simulates network
  return {
    listDoctors: () => delay(DOCTORS), listPharmacies: () => delay(PHARMACIES),
    listHospitals: () => delay(HOSPITALS), listAmbulances: () => delay(AMBULANCES),
    getAppointments: () => delay(read().appts || []),
    bookAppointment: async (a) => {
      if (!a.name || !a.phone) throw new Error("invalid");
      const d = read(); d.appts = d.appts || [];
      d.appts.unshift({...a, id: "ap" + Date.now(), status: "DEMO-CONFIRMED"});
      write(d); return delay(true);
    },
    cancelAppointment: async (id) => { const d = read(); d.appts = (d.appts||[]).filter(x => x.id !== id); write(d); return delay(true); },
    placeOrder: async (o) => { const d = read(); d.orders = d.orders || []; d.orders.unshift({...o, id:"or"+Date.now()}); write(d); return delay(true); },
    getChecklist: (k) => (read().check || {})[k] || [],
    setChecklist: (k, arr) => { const d = read(); d.check = d.check || {}; d.check[k] = arr; write(d); },
    getPrefs: () => read().prefs || {}, setPrefs: (p) => { const d = read(); d.prefs = {...(d.prefs||{}), ...p}; write(d); },
  };
})();

const toRad = d => d * Math.PI / 180;
function km(a, b){ // haversine
  const R = 6371, dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
  const x = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
const withDist = arr => arr.map(x => ({...x, d: km(state.loc, x)}));

/* multilingual search: matches English, Hindi and Hinglish alias text */
const norm = s => String(s||"").toLowerCase().normalize("NFC");
function hay(...parts){ return norm(parts.join(" ")); }
function matches(haystack, q){
  q = norm(q).trim(); if (!q) return true;
  return q.split(/\s+/).every(w => haystack.includes(w));
}
const specOf = id => SPECS.find(s => s.id === id);

/* Radar-style SVG map: relative positions from the user's location */
function MapSVG(items, color){
  const W = 400, H = 340, cx = 200, cy = 170, rMax = 140;
  const pts = items.map(i => {
    const dx = (i.lng - state.loc.lng) * 111 * Math.cos(toRad(state.loc.lat));
    const dy = -(i.lat - state.loc.lat) * 111;
    return {i, dx, dy};
  });
  const maxD = Math.max(1, ...pts.map(p => Math.hypot(p.dx, p.dy)));
  const s = rMax / maxD;
  return `<svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("map_title")}">
    ${[.33,.66,1].map(f => `<circle cx="${cx}" cy="${cy}" r="${rMax*f}" fill="none" stroke="rgba(255,255,255,.15)" stroke-dasharray="4 5"/>`).join("")}
    <line x1="${cx-rMax}" y1="${cy}" x2="${cx+rMax}" y2="${cy}" stroke="rgba(255,255,255,.08)"/>
    <line x1="${cx}" y1="${cy-rMax}" x2="${cx}" y2="${cy+rMax}" stroke="rgba(255,255,255,.08)"/>
    <g class="sweep"><path d="M200 170 L340 170 A140 140 0 0 0 ${200+140*Math.cos(toRad(-35))} ${170+140*Math.sin(toRad(-35))} Z" fill="rgba(255,212,59,.10)"/></g>
    ${pts.map(p => `<g class="dot"><circle cx="${cx+p.dx*s}" cy="${cy+p.dy*s}" r="7" fill="${color}"><title>${esc(L(p.i.name))} – ${Math.hypot(p.dx,p.dy).toFixed(1)} km</title></circle></g>`).join("")}
    <circle cx="${cx}" cy="${cy}" r="9" fill="#fff" stroke="${'#FFD43B'}" stroke-width="4"/>
    <text x="${cx+14}" y="${cy-12}" fill="#fff" font-size="13" font-weight="700">${t("you")}</text>
    <text x="10" y="${H-10}" fill="#9FB1D1" font-size="11">${t("map_title")} · outer ring ≈ ${maxD.toFixed(1)} km</text></svg>`;
}

      ${S("02",hi?"समस्या":"The problem",ul(hi?["कौन-सा डॉक्टर / अस्पताल पास है — यह पता लगाना मुश्किल","दवा की जानकारी और नज़दीकी दुकान बिखरी हुई","आपात में एम्बुलेंस नंबर खोजने में समय बर्बाद","भर्ती / डिस्चार्ज के कागज़ात पर भ्रम"]:["Hard to know which doctor or hospital is nearby","Medicine info and nearby shops are scattered","Time lost finding ambulance numbers in emergencies","Confusion about admission and discharge papers"]))}
      ${S("03",hi?"समाधान":"The solution",ul(hi?["GPS आधारित दूरी से डॉक्टर, फ़ार्मेसी और अस्पताल","ऑनलाइन/क्लिनिक अपॉइंटमेंट बुकिंग","एक टैप में आपातकालीन संपर्क","चेकलिस्ट के साथ भर्ती–ऑपरेशन–डिस्चार्ज मार्गदर्शन"]:["GPS-sorted doctors, pharmacies and hospitals","Online / in-clinic appointment booking","One-tap emergency contacts","Admission–surgery–discharge checklists"]))}
      ${S("04",hi?"मुख्य विशेषताएँ":"Key features",ul(hi?["8 विशेषज्ञताएँ: न्यूरो, मनोविज्ञान, दंत, हड्डी, बाल, वृद्ध, स्त्री रोग, गर्भावस्था","हिन्दी–अंग्रेज़ी–हिंग्लिश बहुभाषी खोज","एनिमेटेड डैशबोर्ड और मैप","सब कुछ मोबाइल-अनुकूल"]:["8 specialities: neuro, psychology, dental, ortho, paediatrics, geriatrics, gynaecology, pregnancy","Hindi–English–Hinglish multilingual search","Animated dashboard and map","Fully mobile-friendly"]))}
      ${S("05",hi?"तकनीक":"Tech stack",ul(["HTML5 · CSS3 (variables, grid, animations) · Vanilla JS",hi?"कंपोनेंट-आधारित रेंडरिंग, i18n शब्दकोश":"Reusable render components, i18n dictionary",hi?"बैकएंड परत: async API + localStorage (सर्वर-रेडी)":"Backend layer: async API + localStorage (server-ready contract)",hi?"आगे: Node/Express + डेटाबेस + असली डॉक्टर/अस्पताल सत्यापन":"Next: Node/Express + database + verified provider onboarding"]))}
      ${S("06",hi?"भरोसा और अगला कदम":"Trust & next steps",ul(hi?["अभी का सारा डेटा डेमो है — असली उपलब्धता नहीं","असली लॉन्च के लिए अस्पताल/डॉक्टर सत्यापन और गोपनीयता नीति ज़रूरी","चिकित्सा जानकारी केवल सामान्य मार्गदर्शन है","आपात में 112 / 108"]:["All data today is DEMO — not real availability","A real launch needs provider verification and a privacy policy","Medical info is general guidance only","Emergency: dial 112 / 108"]))}
    </div>`;
  }
};

/* ---------- Post-render data bindings ---------- */
async function fillList(){
  const list = $("#list"); if (!list) return;
  const v = state.view; let items = [], html = "";
  if (v === "doctors"){
    items = withDist(await API.listDoctors()).filter(d => {
      const sp = specOf(d.spec);
      return (state.spec === "all" || d.spec === state.spec)
        && (state.mode === "all" || d.mode === state.mode || d.mode === "both")
        && matches(hay(d.name.en, d.name.hi, sp.en, sp.hi, sp.alias, d.place.en, d.place.hi, d.langs), state.q);
    });
    items.sort((a,b) => state.sort === "rating" ? b.rating - a.rating : state.sort === "fee" ? a.fee - b.fee : a.d - b.d);
    html = items.map(DoctorCard).join("");
    const ap = await API.getAppointments(), box = $("#appts");
    if (box) box.innerHTML = ap.length ? ap.map(a => `<div class="card"><h3>${esc(a.doctor)}</h3><p class="muted">${esc(a.date)} · ${esc(a.slot)}</p>${Tag(a.status,"on")}${Tag(a.name)}
        <div class="actions"><button class="btn sm ghost" data-cancel="${a.id}">${t("remove")}</button></div></div>`).join("") : `<p class="muted">${t("none_yet")}</p>`;
  }
  if (v === "pharmacy"){
    const mq = state.q;
    items = withDist(await API.listPharmacies()).filter(p =>
      (!state.deliveryOnly || p.delivery) && (!state.openOnly || p.open) &&
      (!mq || p.meds.some(id => { const m = MEDS.find(x => x.id === id); return matches(hay(m.name.en, m.name.hi, m.alias), mq); }) || matches(hay(p.name.en, p.name.hi), mq)));
    items.sort((a,b) => a.d - b.d);
    html = items.map(PharmacyCard).join("");
    const meds = MEDS.filter(m => matches(hay(m.name.en, m.name.hi, m.alias, m.use.en, m.use.hi), mq));
    state.medicine = mq && meds[0] ? L(meds[0].name) : "";
    $("#meds").innerHTML = meds.length ? meds.map(MedCard).join("") : Empty();
    $("#mapBox").innerHTML = MapSVG(items, "#FFD43B");
  }
  if (v === "hospitals"){
    items = withDist(await API.listHospitals()).filter(h =>
      (state.hospType === "all" || h.type === state.hospType) && (!state.openOnly || h.open) &&
      matches(hay(h.name.en, h.name.hi, h.services.en.join(" "), h.services.hi.join(" "), SPECS.filter(s=>h.services.en.some(x=>x.toLowerCase()===s.en.toLowerCase())).map(s=>s.alias).join(" ")), state.q));
    items.sort((a,b) => a.d - b.d);
    html = items.map(HospitalCard).join("");
    $("#mapBox").innerHTML = MapSVG(items, "#3DDC97");
  }
  if (v === "emergency"){
    items = withDist(await API.listAmbulances()).sort((a,b) => (b.avail - a.avail) || (a.d - b.d));
    html = items.map(AmbulanceCard).join("");
    $("#mapBox").innerHTML = MapSVG(items, "#FF6B6B");
  }
  list.innerHTML = html || Empty();
  const rc = $("#resCount"); if (rc) rc.textContent = `${items.length} ${t("results")} · ${tpl("{speciality}")} · ${tpl("{location}")}`;
  observeReveal();
}

function renderChecklist(){
  const box = $("#checks"); if (!box) return;
  const items = AFTERCARE[state.tab][state.lang], done = API.getChecklist(state.tab);
  box.innerHTML = items.map((txt,i) => `<label class="check ${done.includes(i)?"done":""}"><input type="checkbox" data-ck="${i}" ${done.includes(i)?"checked":""}><span>${esc(txt)}</span></label>`).join("");
  const pct = Math.round(done.length / items.length * 100);
  $("#progBar").style.width = pct + "%";
  $("#progTxt").textContent = `${done.length}/${items.length} ${t("done")} (${pct}%)`;
}

function animateDashboard(){
  $$("[data-count]").forEach(el => {
    const end = +el.dataset.count, t0 = performance.now();
    const step = now => { const p = Math.min(1, (now - t0) / 1100); el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  requestAnimationFrame(() => setTimeout(() => $$("#bars div").forEach(b => b.style.height = b.dataset.h * 1.9 + "px"), 120));
}

let io;
function observeReveal(){
  if (!("IntersectionObserver" in window)) return $$(".reveal").forEach(e => e.classList.add("in"));
  io = io || new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold:.08});
  $$(".reveal:not(.in)").forEach((e,i) => { e.style.transitionDelay = Math.min(i * 40, 300) + "ms"; io.observe(e); });
}

/* ---------- 6. Router, shell & events ---------- */
const NAV = [["home","🏠"],["doctors","🩺"],["pharmacy","💊"],["hospitals","🏥"],["emergency","🚑"],["aftercare","📄"],["pitch","🎯"]];

function renderShell(){
  document.documentElement.lang = state.lang === "hi" ? "hi" : "en";
  $("#demoBanner").textContent = t("demoBanner");
  $("#footer").textContent = t("footer");
  $("#topNav").innerHTML = NAV.map(([k]) => `<button data-go="${k}" class="${state.view===k?"active":""}">${t("nav_"+k)}</button>`).join("");
  const mobile = NAV.filter(([k]) => k !== "pitch" && k !== "aftercare").concat([["aftercare","📄"]]);
  $("#bottomNav").innerHTML = mobile.map(([k,ic]) => `<button data-go="${k}" class="${state.view===k?"active":""}"><b>${ic}</b>${t("nav_"+k)}</button>`).join("");
  $$(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === state.lang));
}

async function render(keepScroll){
  renderShell();
  const y = scrollY;
  $("#app").innerHTML = `<div class="view show">${VIEWS[state.view]()}</div>`;
  if (state.view === "home") animateDashboard();
  if (state.view === "aftercare") renderChecklist();
  await fillList();
  observeReveal();
  if (keepScroll) scrollTo(0, y); else scrollTo({top:0,behavior:"smooth"});
}

function go(v){ state.view = v; if (location.hash !== "#" + v) history.replaceState(null, "", "#" + v); render(); }

/* Modals */
function openModal(html){ $("#modal").innerHTML = html; $("#modalBg").classList.add("open"); const f = $("#modal input,#modal select,#modal button"); f && f.focus(); }
function closeModal(){ $("#modalBg").classList.remove("open"); }

function bookingModal(id){
  const d = DOCTORS.find(x => x.id === id), sp = specOf(d.spec);
  const slots = ["10:00","10:30","11:00","11:30","16:00","16:30","17:00","17:30","18:00"];
  const today = new Date(); today.setDate(today.getDate() + 1);
  const iso = today.toISOString().slice(0,10);
  openModal(`<h2>${t("book_title")}</h2><p class="muted">${esc(L(d.name))} · ${sp.ic} ${esc(L(sp))} · ₹${d.fee}</p>
    <p class="tag">${d.mode==="online" ? t("f_online") : d.mode==="offline" ? t("f_offline") : t("both")}</p>
    <label for="bn">${t("your_name")}</label><input id="bn" autocomplete="name">
    <label for="bp">${t("your_phone")}</label><input id="bp" type="tel" inputmode="tel" autocomplete="tel">
    <label for="bd">${t("pick_date")}</label><input id="bd" type="date" value="${iso}" min="${iso}">
    <label>${t("pick_slot")}</label><div class="slots" id="slots">${slots.map((s,i) => `<button class="pill ${i===0?"on":""}" data-slot="${s}">${s}</button>`).join("")}</div>
    <div class="actions" style="margin-top:20px"><button class="btn" data-confirm="${d.id}">${t("confirm")}</button><button class="btn ghost" data-close>${t("cancel")}</button></div>
    <p class="muted mt" style="font-size:.75rem">DEMO – ${state.lang==="hi"?"कोई असली बुकिंग नहीं होती।":"no real booking is made."}</p>`);
}

function orderModal(pid){
  const p = PHARMACIES.find(x => x.id === pid);
  const meds = p.meds.map(id => MEDS.find(m => m.id === id));
  openModal(`<h2>${t("order")}</h2><p class="muted">${esc(L(p.name))} · ${t("eta")} ${p.eta} min</p>
    <label for="om">${t("ctx_med")}</label>
    <select id="om">${meds.map(m => `<option value="${m.id}">${esc(L(m.name))}${m.rx ? " ℞" : ""} – ₹${m.price}</option>`).join("")}</select>
    <label for="on">${t("your_name")}</label><input id="on">
    <label for="op">${t("your_phone")}</label><input id="op" type="tel" inputmode="tel">
    <p class="muted mt" style="font-size:.8rem">℞ = ${t("rx")}. ${t("med_disclaimer")}</p>
    <div class="actions" style="margin-top:18px"><button class="btn" data-confirm-order="${p.id}">${t("order")}</button><button class="btn ghost" data-close>${t("cancel")}</button></div>`);
}

let sosTimer;
function runSOS(){
  clearInterval(sosTimer); state.sosStep = -1;
  const steps = $$("#sosLine div"); steps.forEach(s => s.classList.remove("done"));
  sosTimer = setInterval(() => {
    state.sosStep++; const s = steps[state.sosStep];
    if (!s) { clearInterval(sosTimer); return; }
    s.classList.add("done");
  }, 900);
  toast(state.lang === "hi" ? "डेमो सिमुलेशन शुरू — असली आपात में 112 डायल करें" : "Demo simulation started — dial 112 in a real emergency");
}

function locate(){
  if (!navigator.geolocation) return toast(t("loc_fail"));
  toast(t("locating"));
  navigator.geolocation.getCurrentPosition(
    p => { state.loc = {lat:p.coords.latitude, lng:p.coords.longitude, name: state.lang==="hi" ? "आपकी GPS लोकेशन" : "Your GPS location"};
           // NOTE: sample data is positioned around the default area, so distances from far-away GPS will look large.
           API.setPrefs({loc:state.loc}); toast(t("loc_ok")); render(true); },
    () => { state.loc = DEFAULT_LOC; toast(t("loc_fail")); render(true); },
    {timeout:8000, maximumAge:60000});
}

/* Debounced search keeps focus while list updates */
let st;
function onSearch(v){ state.q = v; clearTimeout(st); st = setTimeout(async () => { await fillList(); }, 160); }

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-go],[data-lang],[data-spec],[data-pickspec],[data-book],[data-order],[data-slot],[data-confirm],[data-confirm-order],[data-close],[data-toggle],[data-htype],[data-tab],[data-sos],[data-locate],[data-cancel],[data-demo-call]");
  if (e.target.id === "modalBg") return closeModal();
  if (!el) return;
  const d = el.dataset;
  if (d.go){ e.preventDefault(); go(d.go); }
  else if (d.lang){ state.lang = d.lang; API.setPrefs({lang:state.lang}); render(true); }
  else if (d.spec){ state.spec = d.spec; render(true); }
  else if (d.pickspec){ state.spec = d.pickspec; go("doctors"); }
  else if (d.book !== undefined) bookingModal(d.book);
  else if (d.order !== undefined) orderModal(d.order);
  else if (d.slot){ $$("#slots .pill").forEach(b => b.classList.toggle("on", b === el)); }
  else if (d.confirm){
    const name = $("#bn").value.trim(), phone = $("#bp").value.trim();
    if (!name || !phone) return toast(t("need_name"));
    const doc = DOCTORS.find(x => x.id === d.confirm);
    await API.bookAppointment({name, phone, doctor:L(doc.name), date:$("#bd").value, slot:($("#slots .on")||{dataset:{slot:"10:00"}}).dataset.slot});
    closeModal(); toast(t("booked")); render(true);
  }
  else if (d.confirmOrder){
    const name = $("#on").value.trim(), phone = $("#op").value.trim();
    if (!name || !phone) return toast(t("need_name"));
    await API.placeOrder({pharmacy:d.confirmOrder, med:$("#om").value, name, phone});
    closeModal(); toast(t("ordered"));
  }
  else if (el.hasAttribute("data-close")) closeModal();
  else if (d.toggle){ state[d.toggle] = !state[d.toggle]; render(true); }
  else if (d.htype){ state.hospType = d.htype; render(true); }
  else if (d.tab){ state.tab = d.tab; render(true); }
  else if (el.hasAttribute("data-sos")) runSOS();
  else if (el.hasAttribute("data-locate")) locate();
  else if (d.cancel){ await API.cancelAppointment(d.cancel); render(true); }
  else if (d.demoCall && /^DEMO/.test(d.demoCall)){ e.preventDefault(); toast(state.lang==="hi" ? "डेमो नंबर — असली नहीं। आपात में 112 डायल करें।" : "Demo number — not real. Dial 112 in an emergency."); }
});

document.addEventListener("input", e => {
  if (e.target.id === "q") onSearch(e.target.value);
});
document.addEventListener("change", e => {
  if (e.target.id === "fMode"){ state.mode = e.target.value; fillList(); }
  if (e.target.id === "fSort"){ state.sort = e.target.value; fillList(); }
  if (e.target.dataset && e.target.dataset.ck !== undefined){
    const cur = API.getChecklist(state.tab), i = +e.target.dataset.ck;
    API.setChecklist(state.tab, e.target.checked ? [...new Set([...cur, i])] : cur.filter(x => x !== i));
    renderChecklist();
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== state.view) { state.view = v; render(); } });

/* Boot */
(function init(){
  const h = location.hash.slice(1); if (VIEWS[h]) state.view = h;
  render(true);
})();
</script>
